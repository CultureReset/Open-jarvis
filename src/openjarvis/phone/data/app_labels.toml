# Display-name hints for apps on the box's phone.
#
# `pm list packages` returns com.facebook.katana, not "Facebook". These are
# display names only -- nothing here changes behaviour, grants anything, or
# decides what an app may do. An app whose package is not listed gets a name
# derived from the package and is marked as derived, so the shell never shows
# a guess as if it were the app's real name.
#
# Add a line when a derived name reads wrong on the owner's screen.

[labels]
"com.facebook.katana" = "Facebook"
"com.facebook.orca" = "Messenger"
"com.instagram.android" = "Instagram"
"com.google.android.apps.messaging" = "Messages"
